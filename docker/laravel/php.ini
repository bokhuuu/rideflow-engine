
[PHP]
; Default is 128M. Filament admin panel loads fonts, processes images,
; runs complex queries - 128M isn't enough. 256M is safe.
memory_limit = 256M

; Maximum size of an entire form POST request.
; If admin uploads a file, the whole request must fit within this.
post_max_size = 50M

; Maximum size of a single uploaded file.
; Must be equal to or less than post_max_size.
upload_max_filesize = 50M

; How many seconds a PHP script can run before PHP kills it.
; Default is 30s. Heavy admin operations (bulk exports, reports) need more.
max_execution_time = 120

; Never show PHP errors in the browser in production.
; If an error happens, the user sees nothing - Laravel handles the error page.
; Errors go to the log file instead (see below).
display_errors = Off

; Always write errors to the log regardless of display_errors.
log_errors = On

; Where PHP writes its error log.
; In Docker, this shows up in: docker logs rideflow_laravel
error_log = /var/log/php_errors.log

; Georgia is UTC+4.
; Without this, PHP uses the server's timezone which may be UTC.
; Wrong timezone = wrong timestamps on rides, payments, logs.
date.timezone = Asia/Tbilisi