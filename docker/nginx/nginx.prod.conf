server {
    listen 80;
    server_name sgscooter.com.ge www.sgscooter.com.ge;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sgscooter.com.ge www.sgscooter.com.ge;

    ssl_certificate /etc/letsencrypt/live/sgscooter.com.ge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgscooter.com.ge/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/public;
    index index.php;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/rideflow_access.log;
    error_log  /var/log/nginx/rideflow_error.log warn;
}