
volumes:
  mysql_data: 
  laravel_storage: 
  vendor_cache:

networks:
  rideflow:
    driver: bridge

services:

  mysql:
    image: mysql:8.0
    container_name: rideflow_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3306:3306"

    networks:
      - rideflow

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s  
      timeout: 5s   
      retries: 5   
      start_period: 20s 

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rideflow_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql    
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8081:80"           
    depends_on:
      mysql:
        condition: service_healthy
    networks:
    - rideflow    

  laravel:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    container_name: rideflow_laravel
    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database

      TCP_BRIDGE_URL: http://python_tcp:8080

    volumes:
      - .:/var/www
      - laravel_storage:/var/www/storage

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - rideflow

  nginx:
    image: nginx:alpine
    container_name: rideflow_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www:ro
      - laravel_storage:/var/www/storage:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - laravel

    networks:
      - rideflow

  python_tcp:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: rideflow_tcp
    restart: unless-stopped

    environment:
      TCP_PORT: 9000
      HTTP_BRIDGE_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "9000:9000"

    volumes:
      - ./tcp_server:/app

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - rideflow

  queue:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    container_name: rideflow_queue
    restart: unless-stopped

    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

    environment:
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      TCP_BRIDGE_URL: http://python_tcp:8080

    volumes:
      - .:/var/www
      - laravel_storage:/var/www/storage

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - rideflow

  scheduler:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    container_name: rideflow_scheduler
    restart: unless-stopped

    command: >
      sh -c "while true;
             do php artisan schedule:run --verbose --no-interaction &
             sleep 60;
             done"

    environment:
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      TCP_BRIDGE_URL: http://python_tcp:8080

    volumes:
      - .:/var/www
      - laravel_storage:/var/www/storage

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - rideflow