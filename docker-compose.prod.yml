services:

  laravel:
    volumes:
      - laravel_storage:/var/www/storage
      - vendor_cache:/var/www/vendor
  mysql:
    ports:
      []

  nginx:
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www:ro
      - laravel_storage:/var/www/storage:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  queue:
    volumes:
      - laravel_storage:/var/www/storage
      - vendor_cache:/var/www/vendor

  scheduler:
    volumes:
      - laravel_storage:/var/www/storage
      - vendor_cache:/var/www/vendor

  python_tcp:
    volumes: []    